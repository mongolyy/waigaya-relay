name: Check Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check:
    name: Issue紐付け確認
    runs-on: ubuntu-latest
    steps:
      - name: PRにIssue紐付けがあるか検証
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i;

            if (!issuePattern.test(body)) {
              core.setFailed(
                'PRにIssueへの紐付けが見つかりません。\n' +
                'PR本文の「関連Issue」欄に "Closes #番号" または "Fixes #番号" を記載してください。'
              );
            } else {
              const match = body.match(issuePattern);
              console.log(`Issue紐付けを確認しました: ${match[0]}`);
            }
