name: Check Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check:
    name: Verify issue linkage
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i;

            if (!issuePattern.test(body)) {
              core.setFailed(
                'No issue reference found in this PR.\n' +
                'Add "Closes #N" or "Fixes #N" to the PR body under "Related Issue".'
              );
            } else {
              const match = body.match(issuePattern);
              console.log(`Issue reference found: ${match[0]}`);
            }
