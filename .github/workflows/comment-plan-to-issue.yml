name: Comment Plan to Issue

on:
  pull_request:
    types: [opened]

jobs:
  comment:
    name: Post execution plan to linked issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Post execution plan as issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prUrl = context.payload.pull_request.html_url;

            const issueMatch = body.match(/(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!issueMatch) {
              console.log('No issue number found, skipping');
              return;
            }
            const issueNumber = parseInt(issueMatch[2]);

            const planMatch = body.match(/##\s*Execution Plan\s*\n([\s\S]*?)(?=\n##\s|\s*$)/);
            const plan = planMatch ? planMatch[1].trim() : null;

            if (!plan) {
              console.log('Execution Plan section is empty, skipping');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `## Execution Plan from PR #${prNumber}`,
                '',
                `**PR:** [${prTitle}](${prUrl})`,
                '',
                plan,
              ].join('\n'),
            });

            console.log(`Posted execution plan to issue #${issueNumber}`);
