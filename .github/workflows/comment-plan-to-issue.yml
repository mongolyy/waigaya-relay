name: Comment Plan to Issue

on:
  pull_request:
    types: [opened]

jobs:
  comment:
    name: 実行計画をIssueにコメント
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: 実行計画をIssueへ投稿
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prUrl = context.payload.pull_request.html_url;

            // Issue番号を取得
            const issueMatch = body.match(/(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!issueMatch) {
              console.log('Issue番号が見つからないためスキップします');
              return;
            }
            const issueNumber = parseInt(issueMatch[2]);

            // 実行計画セクションを抽出
            const planMatch = body.match(/##\s*実行計画\s*\n([\s\S]*?)(?=\n##\s|\s*$)/);
            const plan = planMatch ? planMatch[1].trim() : null;

            if (!plan) {
              console.log('実行計画セクションが空のためスキップします');
              return;
            }

            // Issueにコメントを投稿
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `## PR #${prNumber} の実行計画`,
                '',
                `**PR:** [${prTitle}](${prUrl})`,
                '',
                plan,
              ].join('\n'),
            });

            console.log(`Issue #${issueNumber} に実行計画をコメントしました`);
