name: 機能追加
description: 新機能の追加・改善の提案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 実現したいことを簡潔に説明してください
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: なぜこの機能が必要か説明してください
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 詳細
      description: 具体的な要件や制約があれば記載してください
